# Builds the downloadable apps on GitHub's own machines, one per system.
#
# - Pushing a version tag (v1.2.3) builds them all and makes a DRAFT release
#   with every file attached. Nobody sees it until it's published by hand from
#   the Releases page, and the app's update banner only notices published ones.
# - "Run workflow" on the Actions tab builds them without releasing anything;
#   the files are under that run's Artifacts, for trying a build out first.
#
# Every build is installed and runs its self-test (src/launcher.py) before it's
# kept, so a release can't go out with an app that doesn't start.
#
# The Mac apps are signed and notarized by Apple once the Developer ID
# certificate is in the repo's secrets (docs/adding-maps.md explains setting it
# up); until then they're built unsigned, exactly as before. Windows and Linux
# builds are unsigned. Each release also lists every file's SHA-256 checksum and
# records an attestation, so anyone can check a download came from this repo.
name: Build the apps

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60  # Apple's notarization usually takes minutes, occasionally much longer
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: "Mac (Apple silicon)", runner: macos-15 }
          - { name: "Mac (Intel)", runner: macos-15-intel }
          - { name: "Windows", runner: windows-2022 }
          - { name: "Linux and Chromebook (x64)", runner: ubuntu-22.04 }
          - { name: "Linux and Chromebook (ARM)", runner: ubuntu-22.04-arm }
    defaults:
      run:
        shell: bash
    env:
      # "true" once the certificate is saved as a secret. Only "Run workflow"
      # and version tags start this workflow, so nothing gets signed unless
      # someone with write access to the repo asked for a build.
      MAC_SIGNING: ${{ secrets.MACOS_CERT_P12 != '' }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Check the tag matches the app's version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version=$(sed -n 's/^VERSION = "\(.*\)"/\1/p' src/about.py)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match VERSION = \"$version\" in src/about.py"
            exit 1
          fi

      - name: Install
        run: python -m pip install -r requirements-dev.txt -r requirements-package.txt

      - name: Check the app window's toolkit (Tk) is there
        run: python -c "import tkinter; print('Tk', tkinter.TkVersion)"

      - name: Run the tests
        run: python -m pytest

      # A throwaway keychain holds the certificate for this run only. Setting
      # MACOS_SIGN_IDENTITY is what makes the build and build_dmg.sh sign.
      - name: Set up the signing certificate (Mac)
        if: runner.os == 'macOS' && env.MAC_SIGNING == 'true'
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_password=$(openssl rand -base64 24)
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          echo "$MACOS_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" -P "$MACOS_CERT_PASSWORD" \
            -T /usr/bin/codesign
          rm "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple: -k "$keychain_password" "$keychain" \
            > /dev/null
          security list-keychains -d user -s "$keychain"
          identity=$(security find-identity -v -p codesigning "$keychain" \
            | awk '/"Developer ID Application: / { print $2; exit }')
          if [ -z "$identity" ]; then
            echo "::error::MACOS_CERT_P12 doesn't hold a Developer ID Application certificate"
            exit 1
          fi
          echo "MACOS_SIGN_IDENTITY=$identity" >> "$GITHUB_ENV"

      - name: Build the app
        run: python -m PyInstaller --noconfirm --clean packaging/district_lookup.spec

      - name: Package and self-test (Mac)
        if: runner.os == 'macOS'
        run: |
          packaging/macos/build_dmg.sh dist
          mnt=$(mktemp -d)
          hdiutil attach -nobrowse -readonly -mountpoint "$mnt" dist/*.dmg
          "$mnt/District Lookup.app/Contents/MacOS/District Lookup" --self-test
          hdiutil detach "$mnt"

      # After the self-test, so a broken app is never sent to Apple. Stapling
      # attaches Apple's approval to the disk image, so it opens without a
      # warning even offline. The last check is Gatekeeper's own verdict.
      - name: Notarize (Mac)
        if: runner.os == 'macOS' && env.MAC_SIGNING == 'true'
        timeout-minutes: 45
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          dmg=$(ls dist/*.dmg)
          auth=(--apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD")
          answer() { python -c "import json, sys; print(json.load(sys.stdin).get('$1', ''))" <<< "$result"; }
          result=$(xcrun notarytool submit "$dmg" "${auth[@]}" --wait --timeout 40m --output-format json) \
            || true
          echo "$result"
          status=$(answer status || true)
          if [ "$status" != "Accepted" ]; then
            id=$(answer id || true)
            if [ -n "$id" ]; then xcrun notarytool log "$id" "${auth[@]}" || true; fi
            echo "::error::Apple didn't notarize the app (${status:-no answer}). The reason is above."
            exit 1
          fi
          xcrun stapler staple "$dmg"
          spctl --assess --type open --context context:primary-signature --verbose=2 "$dmg"
          mnt=$(mktemp -d)
          hdiutil attach -nobrowse -readonly -mountpoint "$mnt" "$dmg"
          spctl --assess --type execute --verbose=2 "$mnt/District Lookup.app"
          hdiutil detach "$mnt"

      - name: Remove the signing certificate (Mac)
        if: always() && runner.os == 'macOS' && env.MAC_SIGNING == 'true'
        run: security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true

      - name: Package and self-test (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        timeout-minutes: 15
        run: |
          $version = (Select-String -Path src\about.py -Pattern '^VERSION = "(.*)"').Matches[0].Groups[1].Value
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          & $iscc /DAppVersion=$version packaging\windows\district_lookup.iss
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $setup = (Get-ChildItem dist\*-windows-setup.exe).FullName
          $p = Start-Process $setup -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES' -Wait -PassThru
          if ($p.ExitCode) { throw "installer exited with $($p.ExitCode)" }
          $app = "$env:LOCALAPPDATA\Programs\District Lookup\District Lookup.exe"
          $p = Start-Process $app -ArgumentList '--self-test' -Wait -PassThru
          if ($p.ExitCode) { throw "self-test failed (exit $($p.ExitCode))" }
          Write-Output "Installed app passed its self-test"

      - name: Package and self-test (Linux)
        if: runner.os == 'Linux'
        run: |
          packaging/linux/build_linux.sh dist
          sudo apt-get update -q
          sudo apt-get install -y ./dist/*.deb
          district-lookup --self-test

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.runner }}
          path: |
            dist/*.dmg
            dist/*-windows-setup.exe
            dist/*.deb
            dist/*.tar.gz
          if-no-files-found: error

  release:
    name: Draft release
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write  # these three let actions/attest sign and record the attestation
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: List every file's checksum
        working-directory: dist
        run: sha256sum -- * | tee SHA256SUMS.txt

      # Lets anyone confirm a download was built here, from this repo's code:
      #   gh attestation verify <file> --repo drewsiegler/district-lookup
      - name: Record where the files were built
        uses: actions/attest@v4
        with:
          subject-checksums: dist/SHA256SUMS.txt

      - name: Make a draft release with every app attached
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* --draft \
            --title "District Lookup ${GITHUB_REF_NAME#v}" \
            --notes-file packaging/release-notes.md
